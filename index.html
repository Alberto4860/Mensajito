<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi Valentín?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63031;
            font-size: 2rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .gif-container img {
            max-width: 150px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #btn-yes {
            background-color: #2ecc71;
            color: white;
            z-index: 10;
        }

        #btn-yes:hover {
            background-color: #27ae60;
        }

        #btn-no {
            background-color: #e74c3c;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-container">
            <!-- Puedes cambiar este link por el GIF que más te guste -->
            <img id="gif" src="https://giphy.com" alt="Osito tierno">
        </div>
        
        <h1 id="question">¿Quieres ser mi Valentín? 💖</h1>

        <div class="buttons">
            <button id="btn-yes">¡Sí!</button>
            <button id="btn-no">No</button>
        </div>
    </div>

    <script>
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const question = document.getElementById('question');
        const gif = document.getElementById('gif');

        let yesScale = 1;
        let noClicks = 0;

        // Lista de frases cuando intentan o logran interactuar
        const dynamicPhrases = [
            "¿Segura/o? 🥺",
            "Piénsalo otra vez... 💔",
            "¡Esa opción está rota! 😜",
            "Prueba el botón verde, es más bonito ✨"
        ];

        // Función para mover el botón "No" de forma aleatoria
        function moveNoButton() {
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            // Calcular límites para que no se salga de la tarjeta blanca
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = containerRect.height - btnRect.height - 20;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;

            // Hacer que el botón "Sí" crezca cada vez que huyen del "No"
            yesScale += 0.15;
            btnYes.style.transform = `scale(${yesScale})`;

            // Cambiar el texto de la pregunta para persuadir
            if (noClicks < dynamicPhrases.length) {
                question.innerText = dynamicPhrases[noClicks];
                noClicks++;
            }
        }

        // Eventos para el botón "No" (Escapa al pasar el mouse o tocar en el celular)
        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Evento cuando finalmente presionan "Sí"
        btnYes.addEventListener('click', () => {
            question.innerText = "¡Sabía que dirías que sí! 🥰 Ratificado.";
            // GIF de celebración
            gif.src = "https://giphy.com"; 
            btnNo.style.display = 'none';
            btnYes.style.transform = 'scale(1)';
            btnYes.style.display = 'none';
        });
    </script>
</body>
</html>
